name: Daily Update Rules

# 触发条件：
# 1. 每天国际标准时间 0点 (北京时间早上8点) 执行
# 2. 支持手动点击按钮触发 (workflow_dispatch)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      # 第一步：检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 第二步：下载规则 (核心步骤，在这里修改你的规则源)
      - name: Download Rules
        run: |
          # 创建一个存放规则的文件夹 (可选)
          mkdir -p rules

          # 下载 Anti-AD (保存为 anti-ad.txt)
          curl -L -o rules/anti-ad.txt https://anti-ad.net/easylist.txt

          # 下载 AdGuard DNS filter (保存为 adguarddnsfilter.txt)
          curl -L -o rules/adguarddnsfilter.txt https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt

          # 下载 AdRules (猫队) (保存为 adrules.txt)
          curl -L -o rules/adrules.txt https://raw.githubusercontent.com/Cats-Team/AdRules/main/dns.txt

          # 下载 Hagezi Adblock Plus (保存为 adblockplus.txt)
          curl -L -o rules/adblockplus.txt https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/pro.txt

          # 下载 Hagezi 防博彩/诈骗纯净版 (保存为 adblockgambling.txt)
          curl -L -o rules/adblockgambling.txt https://raw.githubusercontent.com/hagezi/dns-blocklists/main/extensions/gambling.txt

          # 下载其他的...自己按格式加

          # 打印一下文件大小，确认下载成功
          ls -lh rules/

      # 第三步：提交并推送到仓库
      - name: Commit and Push
        run: |
          # 配置 Git 用户信息 (名字随意，会被显示为提交者)
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 添加所有文件
          git add .

          # 提交更改 (如果没有文件变化，这步不会报错)
          git commit -m "Auto update rules: $(date +'%Y-%m-%d')" || exit 0

          # 推送到仓库
          git push
